<html>

<head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</head>

<body>
    <div class="w-full h-full bg-white grid grid-cols-[10vw_40vw_50vw] grid-rows-[9vh_59vh_32vh]">

        <div class="text-black text-5xl flex justify-start">
            <ion-icon name="menu-outline"></ion-icon>
        </div>

        <div>
            <image src="slogo.png" width="40" />
        </div>

        <div class="col-start-2 row-start-2 flex flex-col gap-y-5">
            <p class="text-black text-5xl font-bold">BOOST YOUR SPEED</p>

            <div>
                <p class="text-4xl">30,00$</p>
            </div>

            <div>
                <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Veritatis distinctio ullam maiores numquam
                    aspernatur dolor nesciunt dignissimos facere reiciendis.
                </p>
            </div>

            <div class="bg-red-500 w-[300px] h-[50px] rounded-4xl text-white flex justify-center items-center text-2xl">
                Shop Now</div>
        </div>

        <div class="col-start-3 row-start-2">
            <image src="shoe1.png" width="600" />
        </div>

        <div class="col-start-1 row-start-3 text-4xl flex flex-col justify-center py-5 items-start gap-y-2">
            <ion-icon name="logo-twitter"></ion-icon>
            <ion-icon name="logo-facebook"></ion-icon>
            <ion-icon name="logo-youtube"></ion-icon>
            <ion-icon name="logo-instagram"></ion-icon>
        </div>

        <div class="col-start-2 row-start-3 text-2xl flex justify-end items-center px-5">
            <p class="font-bold">Back<ion-icon name="reload"></ion-icon></p>
        </div>
        <div class="col-start-3 row-start-3 flex gap-x-4 justify-center items-center">
            <p class="text-2xl">Color</p>
            <div class="w-[19] h-[19] bg-black rounded-full"></div>
            <div class="w-[19] h-[19] bg-blue-400 rounded-full"></div>
            <div class="w-[19] h-[19] bg-red-400 rounded-full"></div>
            <div class="w-[19] h-[19] bg-green-500 rounded-full"></div>
            <div class="w-[19] h-[19] bg-yellow-300 rounded-full"></div>
        </div>
    </div>
    </div>
</body>

</html>
